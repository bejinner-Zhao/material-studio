server:
  port: 8080

spring:
  application:
    name: material-studio
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:material_studio}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 40MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.xiaoying.materialstudio
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  storage:
    # 上传素材与生成结果的根目录，Docker 中为 /data
    root: ${STORAGE_ROOT:./data}
  simulator:
    # 指定某一阶段必定失败：NONE / MATERIAL_CHECK / GENERATING / FINALIZING
    fail-stage: ${SIMULATOR_FAIL_STAGE:NONE}
    # 每个阶段的模拟耗时（毫秒）
    stage-delay-ms: ${SIMULATOR_STAGE_DELAY_MS:3000}
    # 同时执行的任务数，其余在库中排队
    max-concurrent: ${SIMULATOR_MAX_CONCURRENT:2}
    # 调度器扫描 PENDING 任务的间隔（毫秒）
    poll-interval-ms: ${SIMULATOR_POLL_INTERVAL_MS:300}
    # 是否开放 /api/dev/simulator，仅用于演示与自测
    dev-api-enabled: ${SIMULATOR_DEV_API_ENABLED:true}
